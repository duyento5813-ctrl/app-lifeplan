<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資管系器材借用系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>資管系器材借用系統</h1>
        <p class="subtitle">提供資管系師生便捷、快速的教學與活動器材借用服務。</p>
    </header>

    <main class="container">
        <!-- 可借用器材類型 -->
        <section class="card">
            <h2>可借用器材類型</h2>
            <ul class="equipment-list">
                <li>
                    <strong>相機：</strong>用於學術活動記錄、課程作業拍攝與專題紀錄。
                </li>
                <li>
                    <strong>投影機：</strong>適用於小組討論、簡報發表與課外研討活動。
                </li>
                <li>
                    <strong>麥克風：</strong>提供課堂演講、大型會議與系所活動音訊擴音。
                </li>
                <li>
                    <strong>腳架：</strong>協助相機與攝影設備穩定拍攝，提升影像品質。
                </li>
            </ul>
        </section>

        <!-- 借用規則 -->
        <section class="card">
            <h2>借用規則</h2>
            <ol class="rules-list">
                <li>借用期限最長為 <strong>7 天</strong>。</li>
                <li>請親自至<strong>系辦辦理</strong>借用與歸還手續。</li>
                <li>若器材有損壞或異常，需主動告知系辦人員。</li>
                <li>逾期未歸還者，將<strong>停權一個月</strong>無法借用器材。</li>
            </ol>
        </section>
    </main>

    <footer>
        <p>線上查詢器材狀態功能即將推出</p>
    </footer>

    <script>
        // JS được viết trực tiếp trong file index.html theo yêu cầu
        console.log("資管系器材借用系統首頁已成功載入。");
    </script>
</body>
</html>
